<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Adicional para dar um toque especial */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
        .btn-whatsapp {
            background-color: #25D366;
            transition: all 0.3s ease;
        }
        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <header class="bg-white py-10 shadow-md mb-10">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tighter uppercase">
                [Nome da Sua Loja]
            </h1>
            <div class="h-1 w-20 bg-blue-600 mx-auto mt-2 rounded-full"></div>
            <p class="mt-3 text-gray-500 italic">Produtos exclusivos selecionados para você</p>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-20">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            {% for produto in produtos %}
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-2xl transition-all duration-300 group">
                <div class="relative overflow-hidden">
                    <img src="{{ produto.imagem }}" alt="{{ produto.nome }}" class="w-full h-72 object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute top-3 right-3 bg-white px-3 py-1 rounded-full text-xs font-bold text-gray-800 shadow">
                        Destaque
                    </div>
                </div>

                <div class="p-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-2 truncate">{{ produto.nome }}</h2>
                    <p class="text-gray-500 text-sm h-12 overflow-hidden mb-4">{{ produto.descricao }}</p>
                    
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="text-xs text-gray-400 block uppercase">Preço</span>
                            <span class="text-2xl font-black text-blue-600">$ {{ produto.preco }}</span>
                        </div>
                        
                        <a href="https://wa.me/SEUNUMERO?text=Olá! Tenho interesse no {{ produto.nome }}" 
                           class="btn-whatsapp text-white p-3 rounded-xl flex items-center justify-center">
                           <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.588-5.946 0-6.556 5.332-11.888 11.888-11.888 3.176 0 6.161 1.237 8.404 3.48s3.48 5.228 3.48 8.404c0 6.556-5.332 11.888-11.888 11.888-2.01 0-3.986-.511-5.741-1.483l-6.242 1.708zm6.402-3.64c1.513.898 3.125 1.372 4.773 1.372 5.093 0 9.238-4.145 9.238-9.238 0-2.467-.961-4.786-2.705-6.53s-4.063-2.705-6.53-2.705c-5.093 0-9.238 4.145-9.238 9.238 0 1.728.483 3.418 1.397 4.904l-.946 3.454 3.511-.96z"/></svg>
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-10 text-center">
        <p>© 2026 - [Seu Nome ou Nome da Loja] - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
